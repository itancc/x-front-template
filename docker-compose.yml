version: '3'

services:
  x-front-template:
    build: .
    container_name: x-front-template
    restart: unless-stopped
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3

  x-front-template-dev:
    image: node:20-alpine
    container_name: x-front-template-dev
    profiles: ['dev']
    working_dir: /app
    command: sh -c "corepack enable ; pnpm install ; pnpm dev --host 0.0.0.0 --port 5678"
    ports:
      - '5678:5678'
    volumes:
      - ./:/app
